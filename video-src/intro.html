<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Видео приветствия · источник</title>
<style>
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/EuclidCircularA-Regular.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/EuclidCircularA-Medium.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/EuclidCircularA-SemiBold.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:700;font-display:swap;src:url(../fonts/EuclidCircularA-Bold.woff) format('woff')}
:root{
  --ink:#22263B; --muted:#626A7E; --surface:#F4F6FA; --soft:#EAEFF8; --line:#E3E6ED;
  --accent:#344079; --accent-ov:rgba(52,64,121,.1); --action:#FFB800; --action-hover:#F6A300;
  --negative:#F15D56; --negative-ov:rgba(241,93,86,.1); --track:#E7E9ED; --overlay:rgba(34,38,59,.8);
  --font:'Euclid Circular A',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9ECF2;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- карточка программы ---------- */
.section{padding:8px 16px 0}
.program{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:16px;background:var(--surface);border:0;border-radius:16px;box-shadow:0 6px 10px -4px rgba(34,38,59,.1);color:var(--ink);text-align:left;font:inherit}
button.program:active{background:#ECEFF6}
.program-media{flex:0 0 80px;width:80px;height:80px;overflow:hidden}
.program-media img{display:block;width:80px;height:80px;object-fit:cover}
.program-text{flex:1;min-width:0;padding-right:24px;font-size:14px;line-height:20px;font-weight:500}
.program .info{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.hr{height:1px;background:var(--line)}
.pad-h{padding:0 16px}
.block{display:flex;align-items:center;gap:12px;margin:8px 16px 0;padding:12px 56px 12px 16px;min-height:44px;background:var(--negative-ov);border-radius:16px;position:relative}
.block>div{flex:1}
.block .iconbtn{position:absolute;right:4px;top:6px}
.block b{display:block;font-size:16px;line-height:22px;font-weight:600}
.block span{display:block;font-size:14px;line-height:20px;color:rgba(34,38,59,.6);margin-top:2px}
.renew{display:flex;align-items:center;gap:12px;padding:12px 16px 16px}
.renew b{display:block;font-size:16px;line-height:22px;font-weight:500}
.renew span{display:block;font-size:14px;line-height:20px;color:var(--muted)}

.heading{padding:24px 16px 12px}
.heading h2{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
.heading p{margin:4px 0 0;font-size:14px;line-height:20px;color:rgba(34,38,59,.6)}

/* ---------- карточки специальностей ---------- */
.cards{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.card{background:#fff;border:1px solid rgba(52,64,121,.14);border-radius:16px;box-shadow:0 6px 10px -4px rgba(34,38,59,.1);overflow:hidden}
.card-main{display:block;width:100%;border:0;background:none;text-align:left;padding:0}
.card-main:active{background:rgba(34,38,59,.04)}
.card-top{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px 8px}
.ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--accent-ov);display:flex;align-items:center;justify-content:center}
.card-name{flex:1;font-size:16px;line-height:24px;font-weight:600}
.card.big .card-name{font-size:18px;font-weight:600}
.card-name-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.card-name-wrap .card-name{flex:none}
.card-free{font-size:14px;line-height:20px;font-weight:600;color:var(--accent)}
.card-free.paid{color:var(--ink)}
.card-price{flex:0 0 auto;font-size:22px;line-height:28px;font-weight:700}
.card-desc{padding:0 16px 12px;font-size:14px;line-height:20px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:12px 16px;background:#fff}
.foot-row{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.foot-row b{flex:1;font-weight:500;display:flex;align-items:center}
.foot-row span{color:var(--muted);text-align:right}
.foot-row b.foot-price{flex:0 0 auto;padding:2px 8px;border-radius:100px;background:rgba(34,38,59,.06);font-size:12px;line-height:16px;font-weight:500;color:var(--ink)}
.foot-row b span.dsc{display:inline-flex;align-items:center;gap:4px;margin-left:4px;line-height:20px;font-weight:400;text-align:left;color:rgba(34,38,59,.6)}
.dsc i{flex:0 0 4px;width:4px;height:4px;border-radius:2px;background:rgba(34,38,59,.4)}
.foot-row b.foot-free{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;background:var(--accent-ov);font-size:12px;line-height:16px;font-weight:500;color:var(--accent)}
.foot.lim{display:flex;flex-direction:column;gap:12px;padding:8px 16px 12px}
.grp{display:flex;flex-direction:column;gap:8px}
.ownrow{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:rgba(34,38,59,.6)}
.ownrow i{flex:0 0 4px;height:4px;border-radius:2px;background:rgba(34,38,59,.4)}
.bar{height:6px;border-radius:3px;background:rgba(34,38,59,.05)}
.bar i{display:block;height:100%;width:var(--w);border-radius:3px;background:var(--accent);min-width:0;animation:fill .9s cubic-bezier(.22,.8,.2,1) both;animation-delay:calc(var(--n,0)*80ms + 150ms)}
@keyframes fill{from{width:0}}
.owner{margin-top:4px;font-size:12px;line-height:16px;font-weight:500;color:rgba(34,38,59,.6)}


html,body{margin:0;background:#EAEFF8}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#cv{position:relative;width:343px;height:256px;overflow:hidden;background:#EAEFF8}
#cam{position:absolute;left:0;top:0;width:375px;transform-origin:0 0;will-change:transform}
#cam .section{padding:16px 16px 0}
.h2{padding:20px 16px 12px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
.cards{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.ring{position:absolute;border:2px solid var(--accent);opacity:0;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(52,64,121,.35);opacity:0;pointer-events:none}
.pin{position:absolute;z-index:3;width:24px;height:24px;border-radius:12px;background:var(--accent);box-shadow:0 0 0 2px #fff;color:#fff;font:600 13px/24px var(--font);text-align:center;opacity:0}

  cam.style.transform='none';
  const i=rel($('#info')),b=rel($('#bar')),c=rel($('#chip'));
  T={i:{cx:i.x+i.w/2,cy:i.y+i.h/2},b:{x:b.x,y:b.y,w:b.w,h:b.h,cx:b.x+b.w/2,cy:b.y+b.h/2},c:{x:c.x,y:c.y,w:c.w,h:c.h,cx:c.x+c.w/2,cy:c.y+c.h/2}};
  const ring=(id,x,y,w,h,r,p)=>{const e=$(id);Object.assign(e.style,{left:(x-p)+'px',top:(y-p)+'px',width:(w+2*p)+'px',height:(h+2*p)+'px',borderRadius:r+'px'})};
  ring('#r1',T.i.cx-13,T.i.cy-13,26,26,13,0);
  ring('#r2',T.b.x,T.b.y,T.b.w,T.b.h,6,5);
  ring('#r3',T.c.x,T.c.y,T.c.w,T.c.h,100,4);
  const rp=$('#rip');Object.assign(rp.style,{left:T.i.cx+'px',top:T.i.cy+'px'});
}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
/* ключевые кадры камеры: t, масштаб, точка страницы P и её положение на экране S */
let K;
function keys(){
  K=[
   {t:0.0,s:.78,P:[187,175],S:[171.5,128]},
   {t:0.5,s:.78,P:[187,175],S:[171.5,128]},
   {t:1.5,s:1.45,P:[T.i.cx-20,T.i.cy+22],S:[190,110]},
   {t:3.0,s:1.45,P:[T.i.cx-20,T.i.cy+22],S:[190,110]},
   {t:4.0,s:1.0,P:[T.b.cx,T.b.cy-8],S:[171.5,118]},
   {t:5.6,s:1.0,P:[T.b.cx,T.b.cy-8],S:[171.5,118]},
   {t:6.6,s:1.7,P:[T.c.cx-30,T.c.cy],S:[205,120]},
   {t:8.0,s:1.7,P:[T.c.cx-30,T.c.cy],S:[205,120]},
   {t:9.1,s:.78,P:[187,175],S:[171.5,128]},
   {t:9.5,s:.78,P:[187,175],S:[171.5,128]}
  ];
}
const END=9.5;
function camAt(t){
  let a=K[0],b=K[K.length-1];
  for(let k=0;k<K.length-1;k++){if(t>=K[k].t&&t<=K[k+1].t){a=K[k];b=K[k+1];break}}
  const u=b.t===a.t?1:ease(clamp((t-a.t)/(b.t-a.t)));
  const s=lerp(a.s,b.s,u),P=[lerp(a.P[0],b.P[0],u),lerp(a.P[1],b.P[1],u)],S=[lerp(a.S[0],b.S[0],u),lerp(a.S[1],b.S[1],u)];
  return {s,tx:S[0]-s*P[0],ty:S[1]-s*P[1]};
}
/* окно видимости подсветки: плавно появляется и гаснет */
const win=(t,a,b,f=.25)=>clamp((t-a)/f)*clamp((b-t)/f);
function setT(t){
  const c=camAt(t);
  cam.style.transform=`translate(${c.tx}px,${c.ty}px) scale(${c.s})`;
  const bw=2/c.s;
  const items=[['#r1',1.5,3.0,'tl'],['#r2',4.0,5.7,'tr'],['#r3',6.6,8.1,'tl']];
  let pin=null;
  items.forEach(([id,a,b,mode],k)=>{
    const e=$(id),o=win(t,a+.15,b,.3);
    // пульс: кольцо чуть «дышит»
    const pulse=1+.05*Math.sin((t-a)*6);
    e.style.opacity=o;e.style.borderWidth=bw+'px';e.style.transform=`scale(${pulse})`;e.style.transformOrigin='center';
    if(o>0.01) pin={k:k+1,o,mode,x:parseFloat(e.style.left),y:parseFloat(e.style.top),w:parseFloat(e.style.width)};
  });
  // тап по «i»
  const rp=$('#rip'),rt=clamp((t-2.0)/.7);
  rp.style.opacity=rt>0&&rt<1?.35*(1-rt):0;
  const rr=(6+16*rt);rp.style.width=rp.style.height=(2*rr)+'px';rp.style.marginLeft=rp.style.marginTop=(-rr)+'px';
  // шкала заполняется заново при появлении
  const f=$('#barfill');if(f){const full=parseFloat(f.style.getPropertyValue('--w'));f.style.width=(full*ease(clamp((t-4.1)/.9)))+'%'; if(t<4.0) f.style.width=full+'%'}
  // номер у подсветки: левый верхний угол кольца в экранных координатах
  const p=$('#pin');
  if(pin){
    p.textContent=pin.k;
    let sx=c.tx+c.s*(pin.mode==='tr'?pin.x+pin.w:pin.x)-(pin.mode==='tr'?16:8),sy=c.ty+c.s*pin.y-12;
    sx=clamp(sx,8,W-32);sy=clamp(sy,8,H-32);
    Object.assign(p.style,{left:sx+'px',top:sy+'px',opacity:pin.o});
  }else p.style.opacity=0;
}
window.setT=setT;window.END=END;
document.fonts.ready.then(()=>{
  measure();keys();setT(0);window.READY=true;
  if(!/[?&]frames/.test(location.search)){
    const t0=performance.now();
    (function loop(){setT(((performance.now()-t0)/1000)%END);requestAnimationFrame(loop)})();
  }
});
</script></body></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECF2">
<title>Просебя — Моя подписка · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22263B; --muted:#626A7E; --surface:#F4F6FA; --soft:#EAEFF8; --line:#E3E6ED;
  --accent:#344079; --accent-ov:rgba(52,64,121,.1); --action:#FFB800; --action-hover:#F6A300;
  --negative:#F15D56; --negative-ov:rgba(241,93,86,.1); --track:#E7E9ED; --overlay:rgba(34,38,59,.8);
  --font:'Euclid Circular A','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9ECF2;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- сцена: телефон + панель ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.device{position:relative;flex:0 0 375px;width:375px;height:min(812px,calc(100vh - 48px));min-height:560px;background:#fff;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 10px #1B1D2B,0 28px 70px rgba(20,24,50,.38)}
.statusbar{flex:0 0 auto;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 15px/1 var(--font);background:#fff;position:relative;z-index:2}
.statusbar svg{display:block}
.viewport{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:#fff}
.viewport::-webkit-scrollbar{display:none}
.home{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;background:#fff}
.home i{width:134px;height:5px;border-radius:3px;background:#000}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;background:#fff;padding:0 4px}
.appbar h1{margin:0;text-align:center;font-size:18px;line-height:24px;font-weight:600}
.iconbtn{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;padding:0}
.iconbtn:active{background:rgba(34,38,59,.05)}

/* ---------- карточка программы ---------- */
.section{padding:8px 16px 0}
.program{background:var(--surface);border-radius:24px}
.program-head{display:flex;align-items:flex-start;gap:8px;padding:12px 4px 8px 16px}
.program-head>div{flex:1;padding-top:8px}
.program-head b{display:block;font-size:18px;line-height:24px;font-weight:600}
.program-head span{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.hr{height:1px;background:var(--line)}
.pad-h{padding:0 16px}
.block{display:flex;align-items:center;gap:12px;margin:12px 12px 0;padding:12px 4px 12px 16px;min-height:44px;background:var(--negative-ov);border-radius:16px}
.block>div{flex:1}
.block b{display:block;font-size:16px;line-height:22px;font-weight:600}
.block span{display:block;font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
.renew{display:flex;align-items:center;gap:12px;padding:12px 16px 16px}
.renew b{display:block;font-size:16px;line-height:22px;font-weight:500}
.renew span{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.program.compact .program-head{padding-bottom:12px}

.heading{padding:24px 16px 12px}
.heading h2{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.heading p{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--muted)}

/* ---------- карточки специальностей ---------- */
.cards{display:flex;flex-direction:column;gap:12px;padding:0 16px 24px}
.card{background:var(--surface);border-radius:24px;padding:8px 0 0;overflow:hidden}
.card-main{display:block;width:100%;border:0;background:none;text-align:left;padding:0}
.card-main:active{background:rgba(34,38,59,.04)}
.card-top{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 16px}
.ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--accent-ov);display:flex;align-items:center;justify-content:center;margin-right:4px}
.card-name{flex:1;font-size:18px;line-height:24px;font-weight:600}
.card-name-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.card-name-wrap .card-name{flex:none}
.card-free{font-size:14px;line-height:20px;font-weight:600;color:var(--accent)}
.card-price{flex:0 0 auto;font-size:22px;line-height:28px;font-weight:700}
.card-desc{padding:0 16px 12px;font-size:14px;line-height:20px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:12px 16px 14px}
.foot-row{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.foot-row b{flex:1;font-weight:600}
.foot-row span{color:var(--muted);text-align:right}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);min-width:0}
.owner{margin-top:8px;font-size:12px;line-height:16px;color:var(--muted)}
.foot.tight .owner{margin-top:4px}

/* ---------- шторки ---------- */
.layer{position:absolute;inset:0;z-index:5;pointer-events:none;visibility:hidden;transition:visibility 0s .25s}
.layer.open{pointer-events:auto;visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .25s}
.layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:8px 16px 34px;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.layer.open .sheet{transform:none}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(34,38,59,.2);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;gap:8px;min-height:56px}
.sheet-head h3{flex:1;margin:0;font-size:20px;line-height:28px;font-weight:600}
.terms{display:flex;flex-direction:column;gap:16px;padding:4px 0 24px}
.terms small{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.terms p{margin:2px 0 0;font-size:16px;line-height:22px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:999px;background:var(--action);color:var(--ink);font-size:16px;font-weight:600}
.btn:active{background:var(--action-hover)}
.btn.tertiary{background:none;color:var(--accent);min-height:44px}

/* ---------- каталог (заглушка), загрузка, ошибка ---------- */
.stub{margin:16px;padding:24px;border:2px dashed #C3C8D6;border-radius:24px;text-align:center}
.stub b{display:block;font-size:18px;line-height:24px;font-weight:600}
.stub p{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--muted)}
.price-recap{margin:16px 16px 0;padding:16px;background:var(--surface);border-radius:24px;display:flex;align-items:center;gap:12px}
.price-recap div{flex:1;font-size:14px;line-height:20px;color:var(--muted)}
.price-recap b{font-size:22px;line-height:28px;font-weight:700;color:var(--ink)}
.note{display:flex;align-items:flex-start;gap:12px;margin:16px 16px 0;padding:12px 16px;background:var(--accent-ov);border-radius:12px}
.note b{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--accent)}
.note span{display:block;font-size:16px;line-height:22px}
.sk{background:var(--track);border-radius:9px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:shine 1.3s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.sk-card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sk-row{display:flex;align-items:center;gap:12px}
.errcard{margin:24px 16px 0;padding:24px 16px 16px;background:var(--surface);border-radius:24px;display:flex;flex-direction:column;gap:16px}
.errcard h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.errcard p{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--muted)}

/* ---------- панель сценариев ---------- */
.panel{flex:0 0 340px;width:340px;max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(20,24,50,.12)}
.panel h2{margin:0 0 4px;font-size:18px;line-height:24px;font-weight:600}
.panel .lead{margin:0 0 16px;font-size:13px;line-height:18px;color:var(--muted)}
.panel h3{margin:20px 0 8px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.presets{display:flex;flex-direction:column;gap:6px}
.preset{display:flex;align-items:baseline;gap:10px;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
.preset code{flex:0 0 32px;font:600 12px/16px var(--font);color:var(--accent)}
.preset span{font-size:14px;line-height:20px}
.preset small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.preset[aria-pressed=true]{border-color:var(--accent);background:var(--accent-ov)}
.ctl{margin:0 0 12px}
.ctl label,.ctl .lbl{display:block;font-size:13px;line-height:18px;margin-bottom:6px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:36px;border:0;border-radius:9px;background:none;padding:6px 8px;font-size:13px;line-height:18px}
.seg button[aria-checked=true]{background:#fff;box-shadow:0 1px 3px rgba(20,24,50,.18);font-weight:600}
.seg.disabled{opacity:.45;pointer-events:none}
.hint{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.switch{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 0;text-align:left;font-size:13px;line-height:18px;min-height:44px}
.switch i{flex:0 0 40px;height:24px;border-radius:12px;background:var(--track);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(16px)}
.copy{margin-top:16px;width:100%;min-height:44px;border:1px solid var(--accent);border-radius:999px;background:#fff;color:var(--accent);font-weight:600;font-size:14px}
.copy.done{background:var(--accent);color:#fff}
.fab,.drawer-close{display:none}

/* планшет и узкий десктоп: панель под телефоном */
@media (max-width:899px){
  .stage{flex-direction:column;align-items:center;gap:24px}
  .panel{width:375px;flex-basis:auto;max-height:none}
}
/* настоящий телефон: прототип на весь экран, панель в шторке */
@media (max-width:500px){
  body{background:#fff}
  .stage{display:block;padding:0;min-height:100dvh}
  .device{width:100%;flex-basis:auto;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
  .statusbar,.home{display:none}
  .viewport{padding-top:env(safe-area-inset-top)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(20,24,50,.35)}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82dvh;border-radius:24px 24px 0 0;z-index:30;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  body.drawer .panel{transform:none}
  .drawer-close{display:flex;position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;align-items:center;justify-content:center}
  .drawer-scrim{position:fixed;inset:0;background:rgba(34,38,59,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
  body.drawer .drawer-scrim{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <h2>Состояния прототипа</h2>
    <p class="lead">Раздел «Моя подписка», сотрудник по корпоративной программе. Все данные демонстрационные. Телефон кликабелен: карточки, ⓘ, шторки. В подписке лимит либо на компанию, либо на клиента, но не оба сразу.</p>

</div>

let S=Object.assign({},DEFAULT);

const vp=$('#viewport');
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';

function hasLimits(cfg,t){return Object.values(CONFIGS[cfg].items).some(i=>i.limit&&(!t||i.limit.t===t))}
function normalize(){
  const c=S.config;
  if(!hasLimits(c)) S.block='none';
  if(!hasLimits(c,'c')){S.corpOut=0;S.hide=0;S.stale=0}
  if(!hasLimits(c,'p')) S.persOut=0;
}
function calc(spec){
  const it=CONFIGS[S.config].items[spec.id];
  const paid=Math.round(spec.full*(100-it.disc)/100);
  const lim=it.limit||null;
  let left=0;
  if(lim){left=lim.left;if(lim.t==='c'&&S.corpOut)left=0;if(lim.t==='p'&&S.persOut)left=0}
  const blocked=!!lim&&S.block!=='none';
  const free=!!lim&&!blocked&&left>0;
  return {spec,lim,disc:it.disc,paid,left,blocked,free,price:free?0:paid};
}
function list(){
  const rows=SPECS.map(calc);
  return rows.filter(r=>r.free).concat(rows.filter(r=>!r.free));
}

const chev='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

function appbar(title,back){
  return `<header class="appbar"><button class="iconbtn" data-act="${back?'back':'noop'}" aria-label="Назад">${backSvg}</button><h1>${title}</h1><span></span></header>`;
}
function program(){
  const lim=hasLimits(S.config);
  const blocked=lim&&S.block!=='none';
  const renew=lim&&S.block!=='perm'&&S.renew==='head';
  let h=`<div class="program${(!blocked&&!renew)?' compact':''}"><div class="program-head"><div><b>Корпоративная программа</b><span>Действует до 31 декабря 2026</span></div><button class="iconbtn" data-act="terms" aria-label="Условия подписки">${infoSvg('#344079')}</button></div>`;
  if(blocked){
    const temp=S.block==='temp';
    h+=`<div class="pad-h"><div class="hr"></div></div><div class="block"><div><b>${temp?'Бесплатные консультации заблокированы до 20 октября':'Бесплатные консультации заблокированы'}</b><span>${temp?'Скидки и платная запись доступны':'Скидки и платная запись сохраняются'}</span></div><button class="iconbtn" data-act="reasons" aria-label="Причины блокировки">${infoSvg('#F15D56')}</button></div>`;
    if(renew) h+='<div class="renew" style="padding-top:12px">'+renewInner()+'</div>';
    else h+='<div style="height:12px"></div>';
  }else if(lim&&renew){
    h+='<div class="pad-h"><div class="hr"></div></div><div class="renew">'+renewInner()+'</div>';
  }
  return h+'</div>';
}
function renewInner(){
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#344079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><div><b>Лимиты обновятся 1 ноября</b><span>Сразу по всем специальностям</span></div>`;
}
function footer(r){
  const right=r.disc?`скидка ${r.disc}%`:'без скидки';
  const own=r.lim&&(r.lim.t==='p'?'Личный лимит':'Общий лимит компании');
  const owner=r.lim&&(S.renew==='cards'&&!r.blocked?own+' · обновится 1 ноября':own);
  if(!r.lim) return `<div class="foot"><div class="foot-row"><b>${r.disc?`Скидка ${r.disc}% по подписке`:'Полная стоимость'}</b></div></div>`;
  if(r.blocked) return `<div class="foot"><div class="foot-row"><b>Бесплатный доступ ограничен</b><span>${right}</span></div></div>`;
  const hidden=r.lim.t==='c'&&S.hide;
  if(r.left===0){
    return `<div class="foot${hidden?' tight':''}"><div class="foot-row"><b>Лимит исчерпан</b><span>${right}</span></div>${hidden?'':'<div class="bar"></div>'}<div class="owner">${owner}</div></div>`;
  }
  const then=S.money?'':`<span>затем ${fmt(r.paid)}</span>`;
  if(hidden) return `<div class="foot tight"><div class="foot-row"><b>${S.money?'В пределах лимита':'Бесплатно по лимиту'}</b>${then}</div><div class="owner">${owner}</div></div>`;
  const pct=Math.max(2,Math.round(r.left/r.lim.total*100));
  return `<div class="foot"><div class="foot-row"><b>${r.left} из ${r.lim.total}</b>${then}</div><div class="bar" role="img" aria-label="Осталось ${r.left} из ${r.lim.total}"><i style="width:${pct}%"></i></div><div class="owner">${owner}</div></div>`;
}
function card(r){
  const s=r.spec;
  return `<article class="card"><button class="card-main" data-act="catalog" data-id="${s.id}" aria-label="${s.name}, ${r.price===0?'бесплатно':fmt(r.price)}. Выбрать специалиста"><div class="card-top"><span class="ico"><svg width="24" height="24" viewBox="0 0 48 48" fill="#344079" aria-hidden="true"><path d="${ICONS[s.id]}"/></svg></span>${S.money&&r.free?`<span class="card-name-wrap"><span class="card-name">${s.name}</span><span class="card-free">Бесплатно</span></span>`:`<span class="card-name">${s.name}</span><span class="card-price">${fmt(r.price)}</span>`}${chev}</div><div class="card-desc">${s.desc}</div></button>${footer(r)}</article>`;
}

}
function catalogScreen(){
  const sp=SPECS.find(x=>x.id===view.spec)||null;
  let h=appbar(sp?sp.name:'Каталог',true);
  if(sp&&S.screen==='ok'){
    const r=calc(sp);
    if(S.stale&&r.free&&r.lim.t==='c'){
      h+=`<div class="note" role="status">${infoSvg('#344079')}<div><b>Лимит компании исчерпан</b><span>Стоимость консультации ${sp.w} сейчас — ${fmt(r.paid)}</span></div></div>`;
    }else{
      h+=`<div class="price-recap"><div>${S.money&&r.free?'Сейчас':'Стоимость сейчас'}<br><b>${S.money&&r.free?'Бесплатно':fmt(r.price)}</b></div></div>`;
    }
  }
  h+=`<div class="stub"><b>Существующий каталог</b><p>Открывается с выбранной специальностью. Дальше — существующий подбор специалиста и запись. В прототипе не реализовано.</p></div>`;
  return h;
}
function sheetHTML(kind){
  if(kind==='terms'){
    const lim=hasLimits(S.config);
    const rows=[['Срок','Действует до 31 декабря 2026'],['Цены','Платные цены по подписке зафиксированы при подключении']];
    if(lim) rows.push(['Лимиты','Бесплатные лимиты обновляются по календарным месяцам. Следующее обновление — 1 ноября. '+(hasLimits(S.config,'c')?'Лимит один на всю компанию: его расходуют все сотрудники':'Лимит личный: у каждого сотрудника свой')]);
    if(lim&&S.money){
      const after=SPECS.map(calc).filter(r=>r.lim).map(r=>`${r.spec.name} — ${fmt(r.paid)}${r.disc?` (скидка ${r.disc}%)`:''}`);
      rows.push(['Цена после бесплатного лимита',after.join('<br>')]);
    }
    rows.push([lim?'Когда лимит исчерпан':'Стоимость','Можно записаться по платной цене вашей подписки: для одних специальностей действует скидка, для других — полная стоимость']);
    if(lim) rows.push(['Блокировка','Блокировка бесплатного доступа не отменяет скидки и возможность платной записи']);
    return `<div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle">Условия подписки</h3><button class="iconbtn" data-act="close-sheet" aria-label="Закрыть">${closeSvg}</button></div><div class="terms">${rows.map(r=>`<div><small>${r[0]}</small><p>${r[1]}</p></div>`).join('')}</div><button class="btn" data-act="close-sheet">Понятно</button>`;
  }
  const temp=S.block==='temp';
  return `<div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle">Об ограничении</h3><button class="iconbtn" data-act="close-sheet" aria-label="Закрыть">${closeSvg}</button></div><div class="terms">${temp
   ?'<p><b>Бесплатные консультации заблокированы до 20 октября</b></p><p>Скидки по подписке сохраняются. Вы можете выбрать специалиста и записаться по цене, указанной в списке</p><p>После снятия блокировки бесплатная запись будет зависеть от доступных лимитов</p>'
   :'<p><b>Бесплатные консультации заблокированы</b></p><p>Бесплатный доступ по этой подписке не восстановится. Платная запись и скидки сохраняются</p>'}</div><button class="btn" data-act="close-sheet">Понятно</button>`;
}

/* ---------------- рендер ---------------- */
function render(){
  normalize();
  if(view.name==='catalog') vp.innerHTML=catalogScreen();
  else if(S.screen==='loading') vp.innerHTML=loadingScreen();
  else if(S.screen==='error') vp.innerHTML=errorScreen();
  else vp.innerHTML=mainScreen();
  if(view.name==='main') vp.scrollTop=mainScroll; else vp.scrollTop=0;
  if(sheetKind) $('#sheet').innerHTML=sheetHTML(sheetKind);
  renderPanel();
  syncHash();
}

/* ---------------- панель ---------------- */
/* пресеты не зависят от «замечаний продакта»: их можно включить поверх любого сценария */
function same(p){const t=Object.assign({},DEFAULT,p.s);return Object.keys(DEFAULT).every(k=>MODE.includes(k)||String(t[k])===String(S[k]))}
function seg(key,opts,dis,hint){
  return `<div class="ctl"><span class="lbl" id="l-${key}">${opts.title}</span><div class="seg${dis?' disabled':''}" role="radiogroup" aria-labelledby="l-${key}">${opts.list.map(o=>`<button type="button" role="radio" aria-checked="${String(S[key])===String(o[0])}" data-k="${key}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>${dis&&hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function renderPanel(){
  const both=S.money===1&&S.renew==='cards';
  $('#product').innerHTML=
   `<button type="button" class="switch" role="switch" aria-checked="${both}" data-sw="both"><i></i><span><b>Все правки продакта</b><br>включить или вернуть как было</span></button>`+
   seg('money',{title:'Цена и слово «Бесплатно»',list:[[0,'Как в макете'],[1,'Меньше про деньги']]})+
   `<div class="hint" style="margin:-6px 0 12px">Бесплатные карточки без рублей: «Бесплатно» под названием, цена после лимита — в «Условиях подписки».</div>`+
   seg('renew',{title:'Дата обновления лимитов',list:[['head','В плашке программы'],['cards','В карточках']]})+
   `<div class="hint" style="margin:-6px 0 0">Обновляются только лимиты, поэтому дата стоит у специальностей с лимитом.</div>`;
  $('#presets').innerHTML=PRESETS.map(p=>`<button type="button" class="preset" data-preset="${p.id}" aria-pressed="${same(p)}"><code>${p.id.toUpperCase()}</code><span>${p.t}<small>${p.h}</small></span></button>`).join('');
  const c=S.config,lim=hasLimits(c),corp=hasLimits(c,'c'),pers=hasLimits(c,'p');
  $('#controls').innerHTML=
   seg('config',{title:'Подписка',list:Object.keys(CONFIGS).map(k=>[k,CONFIGS[k].label])})+
   seg('corpOut',{title:'Лимит компании',list:[[0,'Доступен'],[1,'Исчерпан']]},!corp,'В этой подписке нет лимита компании')+
   seg('hide',{title:'Числа компании',list:[[0,'Показаны'],[1,'Скрыты']]},!corp,'В этой подписке нет лимита компании')+
   seg('persOut',{title:'Личный лимит',list:[[0,'Есть остаток'],[1,'Исчерпан']]},!pers,'В этой подписке нет личных лимитов')+
   seg('block',{title:'Блокировка бесплатного доступа',list:[['none','Нет'],['temp','Временная'],['perm','Постоянная']]},!lim,'Блокировка затрагивает только бесплатные консультации')+
   seg('screen',{title:'Экран',list:[['ok','Обычный'],['loading','Загрузка'],['error','Ошибка']]})+
   `<button type="button" class="switch" role="switch" aria-checked="${!!S.stale}" data-sw="stale" ${corp?'':'disabled style="opacity:.45"'}><i></i><span>Лимит компании закончился, пока человек выбирал: в записи показывается новая цена</span></button>`;
}

/* ---------------- ссылка ---------------- */
function syncHash(){
  const p=PRESETS.find(same);
  const modes=MODE.filter(k=>String(S[k])!==String(DEFAULT[k])).map(k=>k+'='+S[k]).join('&');
  const h=p?p.id+(modes?'&'+modes:''):Object.keys(DEFAULT).map(k=>k+'='+S[k]).join('&');
  try{history.replaceState(null,'','#'+h)}catch(e){}
}
function readHash(){
  const h=location.hash.slice(1);
  if(!h) return;
  const parts=h.split('&');
  const p=PRESETS.find(x=>x.id===parts[0].toLowerCase());
  const n=Object.assign({},DEFAULT,p?p.s:{});
  const q=new URLSearchParams((p?parts.slice(1):parts).join('&'));
  for(const k of Object.keys(DEFAULT)){
    if(!q.has(k)) continue;
    const v=q.get(k);
    n[k]=(typeof DEFAULT[k]==='number')?Number(v)?1:0:v;
  }
  if(!['head','cards'].includes(n.renew)) n.renew='head';
  if(!CONFIGS[n.config]) n.config='composite';
  if(!['none','temp','perm'].includes(n.block)) n.block='none';
  if(!['ok','loading','error'].includes(n.screen)) n.screen='ok';
  S=n;
}

/* ---------------- шторки ---------------- */
function openSheet(kind,trigger){
  sheetKind=kind;lastFocus=trigger||document.activeElement;
  $('#sheet').innerHTML=sheetHTML(kind);
  const l=$('#layer');l.classList.add('open');l.setAttribute('aria-hidden','false');
  setTimeout(()=>{const b=$('#sheet [data-act=close-sheet]');if(b)b.focus()},50);
}
function closeSheet(){
  if(!sheetKind) return;
  sheetKind=null;
  const l=$('#layer');l.classList.remove('open');l.setAttribute('aria-hidden','true');
  if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();
}

/* ---------------- события ---------------- */
document.addEventListener('click',e=>{
  const pr=e.target.closest('[data-preset]');
  if(pr){const p=PRESETS.find(x=>x.id===pr.dataset.preset);S=Object.assign({},DEFAULT,{money:S.money,renew:S.renew},p.s);view={name:'main',spec:null};closeSheet();clearTimeout(loadTimer);document.body.classList.remove('drawer');render();return}
  const sg=e.target.closest('[data-k]');
  if(sg){const k=sg.dataset.k;S[k]=(typeof DEFAULT[k]==='number')?Number(sg.dataset.v):sg.dataset.v;if(k==='config'||k==='screen'){view={name:'main',spec:null};closeSheet()}clearTimeout(loadTimer);render();return}
  const sw=e.target.closest('[data-sw]');
  if(sw){
    if(sw.dataset.sw==='both'){const on=S.money===1&&S.renew==='cards';S.money=on?0:1;S.renew=on?'head':'cards'}
    else S[sw.dataset.sw]=S[sw.dataset.sw]?0:1;
    render();return;
  }
  if(e.target.closest('#copy')){
    const b=$('#copy');
    const done=()=>{b.classList.add('done');b.textContent='Ссылка скопирована';setTimeout(()=>{b.classList.remove('done');b.textContent='Скопировать ссылку на это состояние'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done,done); else done();
    return;
  }
  const a=e.target.closest('[data-act]');
  if(!a) return;
  switch(a.dataset.act){
   case 'drawer': document.body.classList.toggle('drawer');break;
   case 'terms': openSheet('terms',a);break;
   case 'reasons': openSheet('reasons',a);break;
   case 'close-sheet': closeSheet();break;
   case 'catalog': mainScroll=vp.scrollTop;view={name:'catalog',spec:a.dataset.id};render();break;
   case 'catalog-any': view={name:'catalog',spec:null};render();break;
   case 'back': view={name:'main',spec:null};render();break;
   case 'retry':
     S.screen='loading';render();
     loadTimer=setTimeout(()=>{S.screen='ok';render()},1100);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(sheetKind) closeSheet(); else document.body.classList.remove('drawer')}
  if(e.key==='Tab'&&sheetKind){
    const f=[...document.querySelectorAll('#sheet button')];
    if(!f.length) return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
window.addEventListener('hashchange',()=>{readHash();view={name:'main',spec:null};closeSheet();render()});

readHash();
render();
})();
</script>
</body>
</html>

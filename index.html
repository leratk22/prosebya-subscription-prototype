<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAEFF8">
<title>Просебя — Моя подписка · прототип</title>
<link rel="preload" href="fonts/EuclidCircularA-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/EuclidCircularA-SemiBold.woff" as="font" type="font/woff" crossorigin>
<style>
/* Euclid Circular A подключён файлами, а не по имени установленного шрифта: так он одинаково работает в Safari, Chrome и на телефоне */
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/EuclidCircularA-Regular.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/EuclidCircularA-Medium.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/EuclidCircularA-SemiBold.woff) format('woff')}
@font-face{font-family:'Euclid Circular A';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/EuclidCircularA-Bold.woff) format('woff')}
:root{
  --ink:#22263B; --muted:#626A7E; --surface:#F4F6FA; --soft:#EAEFF8; --line:#E3E6ED;
  --accent:#344079; --accent-ov:rgba(52,64,121,.1); --action:#FFB800; --action-hover:#F6A300;
  --negative:#F15D56; --negative-ov:rgba(241,93,86,.1); --track:#E7E9ED; --overlay:rgba(34,38,59,.8);
  --font:'Euclid Circular A',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9ECF2;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- сцена: телефон + панель ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.device{position:relative;flex:0 0 375px;width:375px;height:min(812px,calc(100vh - 48px));min-height:560px;background:var(--soft);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 10px #1B1D2B,0 28px 70px rgba(20,24,50,.38)}
.statusbar{flex:0 0 auto;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 15px/1 var(--font);background:transparent;position:relative;z-index:2}
.statusbar svg{display:block}
.viewport{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:transparent;position:relative;z-index:1}
.viewport::-webkit-scrollbar{display:none}
.home{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;position:relative;z-index:1}
.home i{width:134px;height:5px;border-radius:3px;background:#000}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;background:rgba(234,239,248,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:0 4px}
.appbar h1{margin:0;text-align:center;font-size:18px;line-height:24px;font-weight:600}
.iconbtn{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;padding:0}
.iconbtn:active{background:rgba(34,38,59,.05)}

/* ---------- фон страницы: завиток из главного экрана ---------- */
.device::before{content:"";position:absolute;left:0;right:0;bottom:0;top:190px;background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 -190 375 490%27 width=%27375%27 height=%27490%27%3E%3Cpath transform=%27translate%28-217.94 -126.27%29 rotate%28-18.4%29%27 d=%27M58.783 218.427C114.299 450.308 434.11 223.009 382.433 133.627 330.755 44.244 74.796 328.772 288.961 395.987 467.623 452.061 492.479 255.234 407.388 334.117 347.33 389.796 364.943 491.383 437.996 531.374 501.093 565.915 593.744 578.443 655.784 538.877%27 fill=%27none%27 stroke=%27%23344079%27 stroke-width=%2782%27 stroke-linecap=%27round%27 opacity=%27.06%27/%3E%3C/svg%3E") center/cover no-repeat;pointer-events:none;z-index:0}

/* ---------- карточка программы ---------- */
.section{padding:8px 16px 0}
.program{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:16px;background:var(--surface);border:0;border-radius:16px;box-shadow:0 6px 10px -4px rgba(34,38,59,.1);color:var(--ink);text-align:left;font:inherit}
button.program:active{background:#ECEFF6}
.program-media{flex:0 0 80px;width:80px;height:80px;overflow:hidden}
.program-media img{display:block;width:80px;height:80px;object-fit:cover}
.program-text{flex:1;min-width:0;padding-right:24px;font-size:14px;line-height:20px;font-weight:500}
.program .info{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.hr{height:1px;background:var(--line)}
.pad-h{padding:0 16px}
.block{display:flex;align-items:center;gap:12px;margin:8px 16px 0;padding:12px 56px 12px 16px;min-height:44px;background:var(--negative-ov);border-radius:16px;position:relative}
.block>div{flex:1}
.block .iconbtn{position:absolute;right:4px;top:6px}
.block b{display:block;font-size:16px;line-height:22px;font-weight:600}
.block span{display:block;font-size:14px;line-height:20px;color:rgba(34,38,59,.6);margin-top:2px}
.renew{display:flex;align-items:center;gap:12px;padding:12px 16px 16px}
.renew b{display:block;font-size:16px;line-height:22px;font-weight:500}
.renew span{display:block;font-size:14px;line-height:20px;color:var(--muted)}

.heading{padding:12px 16px 12px}
.heading h2{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
.heading p{margin:4px 0 0;font-size:14px;line-height:20px;color:rgba(34,38,59,.6)}

/* ---------- карточки специальностей ---------- */
.cards{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.card{background:#fff;border:1px solid rgba(52,64,121,.14);border-radius:16px;box-shadow:0 6px 10px -4px rgba(34,38,59,.1);overflow:hidden}
.card-main{display:block;width:100%;border:0;background:none;text-align:left;padding:0}
.card-main:active{background:rgba(34,38,59,.04)}
.card-top{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px 8px}
.ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--accent-ov);display:flex;align-items:center;justify-content:center}
.card-name{flex:1;font-size:16px;line-height:24px;font-weight:600}
.card-name-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.card-name-wrap .card-name{flex:none}
.card-free{font-size:14px;line-height:20px;font-weight:600;color:var(--accent)}
.card-free.paid{color:var(--ink)}
.card-desc{padding:0 16px 12px;font-size:14px;line-height:20px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:12px 16px;background:#fff}
.foot-row{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.foot-row b{flex:1;font-weight:500;display:flex;align-items:center}
.foot-row span{color:var(--muted);text-align:right}
.foot-row b.foot-price{flex:0 0 auto;padding:2px 8px;border-radius:100px;background:rgba(34,38,59,.06);font-size:12px;line-height:16px;font-weight:500;color:var(--ink)}
.foot-row b span.dsc{display:inline-flex;align-items:center;gap:4px;margin-left:4px;line-height:20px;font-weight:400;text-align:left;color:rgba(34,38,59,.6)}
.dsc i{flex:0 0 4px;width:4px;height:4px;border-radius:2px;background:rgba(34,38,59,.4)}
.foot-row b.foot-free{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;background:var(--accent-ov);font-size:12px;line-height:16px;font-weight:500;color:var(--accent)}
.foot.lim{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.foot.lim.compact{gap:4px}
.ownrow{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:rgba(34,38,59,.6)}
.ownrow i{flex:0 0 4px;height:4px;border-radius:2px;background:rgba(34,38,59,.4)}
.bar{height:6px;border-radius:3px;background:rgba(34,38,59,.05)}
.bar i{display:block;height:100%;width:var(--w);border-radius:3px;background:var(--accent);min-width:0;animation:fill .9s cubic-bezier(.22,.8,.2,1) both;animation-delay:calc(var(--n,0)*80ms + 150ms)}
@keyframes fill{from{width:0}}
.owner{margin-top:4px;font-size:12px;line-height:16px;font-weight:500;color:rgba(34,38,59,.6)}

/* ---------- общий пул лимита (единая карточка) ---------- */
.pool-list{display:flex;flex-direction:column}
.pool-item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:#fff;text-align:left}
.pool-item:first-child{border-top:0}
.pool-item:active{background:rgba(34,38,59,.04)}
.pool-sub{font-size:12px;line-height:16px;color:var(--muted);margin-top:1px}
.pool-item .foot-price{flex:0 0 auto;padding:2px 8px;border-radius:100px;background:rgba(34,38,59,.06);font-size:12px;line-height:16px;font-weight:500;color:var(--ink)}

/* ---------- шторки ---------- */
.layer{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;visibility:hidden;transition:visibility 0s .22s}
.layer.open{pointer-events:auto;visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(34,38,59,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .22s}
.layer.open .scrim{opacity:1}
/* поп-ап как в ЛК: по центру, радиус 24, отступы 24 24 20 */
.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:343px;max-height:80%;overflow:hidden;background:#fff;border-radius:24px;padding:24px 24px 20px;opacity:0;transform:scale(.96);transition:opacity .2s,transform .22s cubic-bezier(.2,.8,.2,1)}
.layer.open .sheet{opacity:1;transform:none}
.sheet-head{display:flex;align-items:center;padding-right:32px;min-height:24px}
.sheet-head h3{flex:1;margin:0;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.dlg-x{position:absolute;top:12px;right:12px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(34,38,59,.05);display:flex;align-items:center;justify-content:center;padding:0}
.dlg-x::after{content:"";position:absolute;inset:-10px}
.dlg-x:active{background:rgba(34,38,59,.1)}
.terms{display:flex;flex-direction:column;gap:16px;padding:16px 0 24px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sheet-head,.sheet .btn{flex:0 0 auto}
.terms small{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.terms p{margin:2px 0 0;font-size:16px;line-height:22px}
.sheet .btn{min-height:44px;border-radius:32px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:999px;background:var(--action);color:var(--ink);font-size:16px;font-weight:600}
.btn:active{background:var(--action-hover)}
.btn.tertiary{background:none;color:var(--accent);min-height:44px}

/* ---------- каталог специалистов, загрузка, ошибка ---------- */
.cat-page{min-height:100%;display:flex;flex-direction:column;background:var(--soft)}
.cat-search{display:flex;flex-direction:column;gap:8px;padding:8px 16px}
.cat-field{display:flex;align-items:center;gap:4px;padding:12px 16px;border-radius:16px;background:rgba(34,38,59,.05)}
.cat-field img{flex:0 0 20px;display:block}
.cat-field input{flex:1;min-width:0;border:0;background:none;font:400 14px/20px var(--font);color:var(--ink);outline:none;padding:0}
.cat-field input::placeholder{color:rgba(34,38,59,.6)}
.cat-hint{padding:0 16px;font-size:14px;line-height:20px;color:rgba(34,38,59,.6)}
.cat-inf-wrap{padding:8px 16px 0}
.cat-inf{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--accent-ov)}
.cat-inf img{flex:0 0 28px;display:block}
.cat-inf p{margin:0;flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--ink)}
.cat-content{flex:1 1 auto;display:flex;flex-direction:column;gap:16px;padding:12px 16px 24px}
.cat-h2{margin:0;padding-bottom:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.spec-card{background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(34,38,59,.05),0 12px 24px -4px rgba(34,38,59,.05);overflow:hidden}
.spec-top{display:flex;align-items:flex-start;gap:16px;padding:16px}
.spec-ava{flex:0 0 80px;width:80px;height:80px;border-radius:999px;overflow:hidden;background:var(--soft)}
.spec-ava img{display:block;width:80px;height:80px;object-fit:cover}
.spec-meta{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.spec-name{margin:0;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.spec-slot{font-size:12px;line-height:16px;font-weight:500;color:rgba(34,38,59,.6);padding:4px 0}
.spec-slot.today{padding:4px 8px;border-radius:999px;background:rgba(117,159,69,.06);color:#759F45}
.spec-info{display:flex;align-items:center;justify-content:space-between;padding:16px;border-top:1px solid rgba(34,38,59,.1)}
.spec-info-half{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:20px;color:rgba(34,38,59,.6)}
.spec-rating{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:var(--accent)}
.spec-rating img{display:block;flex:0 0 16px}
.spec-cnt{padding:2px 8px;border-radius:999px;background:rgba(34,38,59,.05);font-size:12px;line-height:16px;color:rgba(34,38,59,.6)}
.spec-price-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;padding:4px 0;font-size:14px;line-height:20px;color:rgba(34,38,59,.6);white-space:nowrap}
.spec-price-btn:active{opacity:.65}
.spec-price-btn img{display:block;flex:0 0 12px}
/* поп-ап стоимости (из Figma PopupPrice) */
.sheet:has(.pp-body){max-width:304px;padding:16px}
.pp-body{display:flex;flex-direction:column;gap:12px;padding:12px 0 16px}
.pp-box{background:var(--surface);border-radius:12px;padding:12px;width:100%}
.pp-val{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.pp-val.free{color:#759F45}
.pp-details{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px;width:100%}
.pp-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pp-k{color:rgba(34,38,59,.4)}
.pp-v{font-weight:500;color:var(--ink);text-align:right}
.pp-v.strike{text-decoration:line-through}
.pp-v.disc{color:#759F45}
.cat-empty{padding:24px 16px;text-align:center;font-size:14px;line-height:20px;color:var(--muted)}
.cat-cta{position:sticky;bottom:0;left:0;right:0;padding:12px 32px 16px;background:linear-gradient(to bottom,rgba(234,239,248,0),#EAEFF8 35%);margin-top:auto}
.cat-cta button{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border:0;border-radius:999px;background:var(--action);color:var(--ink);font-size:16px;line-height:24px;font-weight:600}
.cat-cta button:active{background:var(--action-hover)}
.sk{background:var(--track);border-radius:9px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:shine 1.3s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.sk-card{background:#fff;border:1px solid rgba(52,64,121,.14);box-shadow:0 6px 10px -4px rgba(34,38,59,.1);border-radius:16px;overflow:hidden}
.sk-top{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px 8px}
.sk-foot{display:flex;flex-direction:column;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.sk-row{display:flex;align-items:center;gap:12px}
.sk{background:rgba(34,38,59,.07)}
.errstate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100% - 118px);padding-bottom:80px;text-align:center}
.errstate img{display:block;width:180px;height:180px;object-fit:cover}
.errstate .txt{display:flex;flex-direction:column;align-items:center;align-self:stretch;gap:24px;padding:8px 32px 32px}
.errstate h2{margin:0;font-size:28px;line-height:32px;letter-spacing:-.02em;font-weight:600}
.errstate p{margin:12px 0 0;font-size:16px;line-height:24px;color:rgba(34,38,59,.8)}
.errstate .retry{display:flex;align-items:center;justify-content:center;height:48px;padding:12px 16px;border:1px solid rgba(52,64,121,.2);border-radius:999px;background:none;color:var(--accent);font:inherit;font-size:16px;line-height:24px;font-weight:600}
.errstate .retry:active{background:rgba(52,64,121,.06)}

/* ONBOARDING:start — приветственный поп-ап с видео. Чтобы убрать: удалить блоки ONBOARDING в CSS и JS и три строки JS с пометкой ONB */
.intro{margin:-24px -24px -20px;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.onb-media{position:relative;flex:0 0 auto;height:256px;margin:4px 4px 0;border-radius:20px;background:var(--soft);overflow:hidden;transform:translateZ(0)}
.onb-media video{display:block;width:100%;height:100%;object-fit:cover}
.onb-media::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);pointer-events:none}
.onb-x{background:rgba(255,255,255,.8)}
.sheet:has(.intro){max-height:92%}
.onb-body{padding:16px 24px 16px}
.onb-body .btn{width:calc(100% + 16px);margin:0 -8px}
.onb-body h3{margin:0;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.onb-list{display:flex;flex-direction:column;gap:12px;margin:0;padding:12px 0 16px;list-style:none}
.onb-list li{display:flex;align-items:flex-start;gap:8px}
.onb-list li span{display:block;font-size:16px;line-height:24px;font-weight:500}
.onb-list li small{display:block;font-size:14px;line-height:20px;color:rgba(34,38,59,.7)}
.onb-list b{flex:0 0 16px;text-align:left;font-size:16px;line-height:24px;font-weight:400;color:rgba(34,38,59,.6)}
.onb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ONBOARDING:end */

/* ---------- панель сценариев ---------- */
.panel{flex:0 0 340px;width:340px;max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(20,24,50,.12)}
.panel h2{margin:0 0 4px;font-size:18px;line-height:24px;font-weight:600}
.panel .lead{margin:0 0 16px;font-size:13px;line-height:18px;color:var(--muted)}
.panel h3{margin:20px 0 8px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.presets{display:flex;flex-direction:column;gap:6px}
.preset{display:flex;align-items:baseline;gap:10px;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
.preset code{flex:0 0 32px;font:600 12px/16px var(--font);color:var(--accent)}
.preset span{font-size:14px;line-height:20px}
.preset small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.preset[aria-pressed=true]{border-color:var(--accent);background:var(--accent-ov)}
.ctl{margin:0 0 12px}
.ctl:last-child{margin-bottom:0}
.ctl label,.ctl .lbl{display:block;font-size:13px;line-height:18px;font-weight:500;margin-bottom:6px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr}
.seg button{flex:1 1 auto;min-height:36px;border:0;border-radius:9px;background:none;padding:6px 8px;font-size:13px;line-height:18px}
.seg button[aria-checked=true]{background:#fff;box-shadow:0 1px 3px rgba(20,24,50,.18);font-weight:600}
.seg.disabled{opacity:.45;pointer-events:none}
.subbox{margin:10px 0 16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.subbox .seg{background:rgba(34,38,59,.06)}
.subbox .subnote{margin:0;font-size:13px;line-height:18px;color:var(--muted)}
.hint{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.switch{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 0;text-align:left;font-size:13px;line-height:18px;min-height:44px}
.switch i{flex:0 0 40px;height:24px;border-radius:12px;background:var(--track);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(16px)}
.copy{margin-top:16px;width:100%;min-height:44px;border:1px solid var(--accent);border-radius:999px;background:#fff;color:var(--accent);font-weight:600;font-size:14px}
.copy.done{background:var(--accent);color:#fff}
.fab,.drawer-close{display:none}

/* планшет и узкий десктоп: панель под телефоном */
@media (max-width:899px){
  .stage{flex-direction:column;align-items:center;gap:24px}
  .panel{width:375px;flex-basis:auto;max-height:none}
}
/* настоящий телефон: прототип на весь экран, панель в шторке */
@media (max-width:500px){
  body{background:var(--soft)}
  .stage{display:block;padding:0;min-height:100dvh}
  .device{width:100%;flex-basis:auto;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
  .statusbar,.home{display:none}
  .viewport{padding-top:env(safe-area-inset-top)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(20,24,50,.35)}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82dvh;border-radius:24px 24px 0 0;z-index:30;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  body.drawer .panel{transform:none}
  .drawer-close{display:flex;position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;align-items:center;justify-content:center}
  .drawer-scrim{position:fixed;inset:0;background:rgba(34,38,59,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
  body.drawer .drawer-scrim{opacity:1;pointer-events:auto}
}
body.clean .panel,body.clean .fab,body.clean .drawer-scrim{display:none!important}

const eyeSvg='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.666" cy="8" r="4" fill="#344079" fill-opacity=".15"/><path d="M9.666 8a4 4 0 1 1-8 0a4 4 0 0 1 8 0ZM10.281 12C11.439 12 12.577 11.498 13.359 10.557C14.591 9.075 14.591 6.925 13.359 5.443C12.577 4.502 11.439 4 10.281 4M6.778 7.333L5.25 8.862L4.333 7.945" fill="none" stroke="#344079" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function footer(r,n){

  if(r.unlim) return `<div class="foot"><div class="foot-row"><b>Без ограничений</b><b class="foot-free">${eyeSvg}Бесплатно</b></div></div>`;
  if(!r.lim) return `<div class="foot"><div class="foot-row"><b>${r.disc?`Со скидкой ${r.disc}% по подписке`:'Полная стоимость'}</b><b class="foot-price">${fmt(r.paid)}</b></div></div>`;

  return `<article class="card pool-card"><div class="pool-list">${rows}</div>${poolFootHTML(group,n)}</article>`;

function renderCards(){
  const rows=list(), out=[], seen=new Set();
  let idx=0;
  for(const r of rows){
    if(r.lim&&r.lim.pool&&r.free){
      const key=r.lim.pool;
      if(seen.has(key)) continue;
      seen.add(key);
      const group=rows.filter(x=>x.lim&&x.lim.pool===key&&x.free);
      if(group.length>1){
        out.push(poolCard(group,idx));
        idx++;
        continue;
      }
    }
    out.push(card(r,idx));
    idx++;
  }
  return out.join('');
}

/* ---------------- ссылка ---------------- */
function syncHash(){
  const diff=Object.keys(DEFAULT).filter(k=>String(S[k])!==String(DEFAULT[k])).map(k=>k+'='+S[k]).join('&');
  const h=(diff||'type='+S.type)+(CLEAN?'&clean=1':'');
  try{history.replaceState(null,'','#'+h)}catch(e){}
}
function readHash(){
  const h=location.hash.slice(1);
  if(!h) return;
  const parts=h.split('&').filter(x=>{if(x==='clean'||x==='clean=1'){CLEAN=true;return false}return true});
  document.body.classList.toggle('clean',CLEAN);
  const key=(parts[0]||'').toLowerCase();
  const leg=LEGACY[key];
  const n=Object.assign({},DEFAULT,leg||{});
  const q=new URLSearchParams((leg?parts.slice(1):parts).join('&'));
  for(const k of Object.keys(DEFAULT)){
    if(!q.has(k)) continue;
    const v=q.get(k);
    n[k]=(typeof DEFAULT[k]==='number')?Number(v)?1:0:v;
  }
  if(!['corp','pers','unlim','disc'].includes(n.type)) n.type='corp';
  if(!['none','temp','perm'].includes(n.block)) n.block='none';
  if(!['ok','loading','error'].includes(n.screen)) n.screen='ok';
  S=n;
}

/* ---------------- шторки ---------------- */
function openSheet(kind,trigger){
  sheetKind=kind;lastFocus=trigger||document.activeElement;
  $('#sheet').innerHTML=sheetHTML(kind);
  const l=$('#layer');l.classList.add('open');l.setAttribute('aria-hidden','false');
  setTimeout(()=>{const b=$('#sheet [data-act=close-sheet]');if(b)b.focus()},50);
}
function closeSheet(){
  if(!sheetKind) return;
  sheetKind=null;
  const l=$('#layer');l.classList.remove('open');l.setAttribute('aria-hidden','true');
  if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();
}

/* ONBOARDING:start — приветственный поп-ап: одно зацикленное видео (video/intro.mp4) и три коротких пункта, показывается один раз на устройстве.
   В ссылку можно добавить &intro=1 (показать всегда) или &intro=0 (не показывать). Источник видео — папка video-src */
const ONB=(()=>{
  const KEY='prosebya.subscription.intro';
  const force=(/[#&]intro=(\d)/.exec(location.hash)||[])[1];
  const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  const seen=()=>{try{return localStorage.getItem(KEY)==='1'}catch(e){return false}};
  const mark=()=>{try{localStorage.setItem(KEY,'1')}catch(e){}};
  const POINTS=[['Условия подписки','Срок и правила, нажмите на баннер'],['Бесплатные консультации','Шкала показывает остаток лимита'],['Цена консультации','Уже со скидкой, если она есть']];
  function html(){
    return `<div class="intro" role="group" aria-label="Как устроен раздел"><span class="onb-sr" id="sheetTitle">Как устроен раздел</span>`+
      `<div class="onb-media"><video src="video/intro-v4.mp4" poster="video/intro-v4.jpg" muted loop playsinline preload="auto" aria-hidden="true"${reduce?'':' autoplay'}></video></div>`+
      `<div class="onb-body"><h3>Как устроен раздел</h3><ul class="onb-list">${POINTS.map((t,k)=>`<li><b>${k+1}.</b><div><span>${t[0]}</span><small>${t[1]}</small></div></li>`).join('')}</ul>`+
      `<button class="btn" data-act="close-sheet">Понятно</button></div></div>`+
      `<button class="dlg-x onb-x" data-act="close-sheet" aria-label="Закрыть">${closeSvg}</button>`;
  }
  function show(){
    openSheet('intro',document.activeElement);mark();
    const v=document.querySelector('#sheet video');
    if(v&&!reduce){v.muted=true;const go=()=>{if(v.isConnected&&v.paused){const p=v.play();if(p&&p.catch)p.catch(()=>{})}};go();v.addEventListener('canplay',go);setTimeout(go,400)}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-onb-show]')){document.body.classList.remove('drawer');show()}
  });
  return {
    html,
    init(){if(force==='0') return;if(force==='1'||!seen()) setTimeout(show,500)},
    panelBtn(){return `<button type="button" class="copy" data-onb-show style="margin-top:4px">Показать приветствие</button><div class="hint" style="margin:6px 0 12px">Поп-ап первого входа: появляется один раз на устройстве. В ссылке: <code>&amp;intro=0</code> — пропустить, <code>&amp;intro=1</code> — показать всегда.</div>`}
  };
})();
/* ONBOARDING:end */

/* ---------------- события ---------------- */
document.addEventListener('click',e=>{
  const sg=e.target.closest('[data-k]');
  if(sg){const k=sg.dataset.k;S[k]=(typeof DEFAULT[k]==='number')?Number(sg.dataset.v):sg.dataset.v;if(k==='type'||k==='screen'){view={name:'main',spec:null};closeSheet()}clearTimeout(loadTimer);render();return}
  const sw=e.target.closest('[data-sw]');
  if(sw){S[sw.dataset.sw]=S[sw.dataset.sw]?0:1;render();return}
  if(e.target.closest('#copy')){
    const b=$('#copy');
    const done=()=>{b.classList.add('done');b.textContent='Ссылка скопирована';setTimeout(()=>{b.classList.remove('done');b.textContent='Скопировать ссылку на это состояние'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done,done); else done();
    return;
  }
  const a=e.target.closest('[data-act]');
  if(!a) return;
  switch(a.dataset.act){
   case 'drawer': document.body.classList.toggle('drawer');break;
   case 'reasons': openSheet('reasons',a);break;
   case 'price-popup': openSheet('price',a);break;
   case 'close-sheet': closeSheet();break;
   case 'catalog': mainScroll=vp.scrollTop;view={name:'catalog',spec:a.dataset.id};render();break;
   case 'catalog-any': view={name:'catalog',spec:null};render();break;
   case 'back': view={name:'main',spec:null};render();break;
   case 'retry':
     S.screen='loading';render();
     loadTimer=setTimeout(()=>{S.screen='ok';render()},1100);break;
  }
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='catSearch'){const l=$('#catList'),sp=SPECS.find(x=>x.id===view.spec)||null;if(l)l.innerHTML=specCardsHTML(e.target.value,sp?calc(sp):null)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(sheetKind) closeSheet(); else document.body.classList.remove('drawer')}
  if(e.key==='Tab'&&sheetKind){
    const f=[...document.querySelectorAll('#sheet button')];
    if(!f.length) return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
window.addEventListener('hashchange',()=>{readHash();view={name:'main',spec:null};closeSheet();render()});

readHash();
render();
ONB.init(); /*ONB*/
})();
</script>
</body>
</html>
